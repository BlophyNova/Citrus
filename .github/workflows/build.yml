name: Build

on: [ push ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Set gradlew file permission
        run: chmod +x ./gradlew
      - name: Build FatJar File
        run: ./gradlew buildFatJar --scan
      - name: Build Docker Image
        run: ./gradlew buildImage --scan
      - name: Upload FatJar
        uses: actions/upload-artifact@v4
        with:
          name: Citrus.jar
          path: build/libs/Citrus-all.jar
      - name: Upload Docker Image
        uses: actions/upload-artifact@v4
        with:
          name: Citrus.tar
          path: build/jib-image.tar